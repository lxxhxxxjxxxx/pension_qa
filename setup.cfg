[mutmut]
source_paths=app
# mutants/ 안에 레포를 복사해 놓고 거기서 테스트를 돌린다 — 그래서 **테스트가 쓰는 것은 전부**
# 복사돼 있어야 한다. 하나라도 빠지면 "failed to collect stats. runner returned 1" 로 mutmut 이
# 통째로 죽는다(에러가 mutmut 것처럼 보여서 원인을 찾기 어렵다).
#   scripts          — 26강 aggregate_reviews · 27강 append_backlog/scan_debt 를 테스트가 import
#   pension_qa_docs  — 22강 MCP 서버 모듈
#   .claude          — 24강 ConfigChange 감사 훅, 25강 guard-diff-size 훅을 테스트가 직접 실행
#   docs · CLAUDE.md · harness_check.sh — 24강 재발방지 회귀·하네스 점검이 읽는다
#   plugins · .claude-plugin · .mcp.json — 28강 플러그인 드리프트 테스트가 읽는다(build_plugin 이 .mcp.json 을 입력으로 쓴다)
# ⚠️ 콤마 구분(also_copy=data,scripts)은 파싱되지 않는다 — 반드시 아래처럼 줄바꿈 리스트로.
also_copy=
    data
    scripts
    pension_qa_docs
    docs
    .claude
    CLAUDE.md
    harness_check.sh
    plugins
    .claude-plugin
    .mcp.json

[tool:pytest]
norecursedirs = mutants
